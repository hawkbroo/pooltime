<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админка · POOL TIME</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="gate" id="gate">
    <form class="gate__card" id="login-form">
      <h1>POOL TIME</h1>
      <p>Кабинет: меню, цены, столы, скидки</p>
      <label>Пароль<input type="password" id="password" required autocomplete="current-password" /></label>
      <button type="submit">Войти</button>
      <p class="hint">Пароль по умолчанию: <code>pooltime2026</code></p>
      <p class="err" id="login-err" hidden>Неверный пароль</p>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <header class="bar">
      <strong>Админка POOL TIME</strong>
      <div class="bar__actions">
        <a href="../" target="_blank">Открыть сайт</a>
        <button type="button" id="logout">Выйти</button>
      </div>
    </header>

    <main class="wrap">
      <section class="block">
        <h2>Клуб</h2>
        <div class="grid-2">
          <label>Адрес<input id="club-address" /></label>
          <label>Режим работы<input id="club-hours" /></label>
          <label>Телефон<input id="club-phone" /></label>
          <label>Телефон (для звонка, цифры)<input id="club-phone-raw" placeholder="79182395248" /></label>
          <label>WhatsApp URL<input id="club-wa" /></label>
          <label>MAX URL<input id="club-max" /></label>
          <label class="full">Фраза по умолчанию (если нет скидки)<input id="club-tagline" /></label>
        </div>
      </section>

      <section class="block">
        <h2>Бильярд · цена часа</h2>
        <div class="grid-2">
          <label>Цена, ₽<input id="billiard-price" type="number" min="0" /></label>
          <label>Подпись<input id="billiard-note" /></label>
        </div>
      </section>

      <section class="block">
        <h2>Скидки</h2>
        <label class="check"><input type="checkbox" id="promo-enabled" /> Показывать акцию</label>
        <label>Текст акции (бегущая строка + карточка)<textarea id="promo-text" rows="3"></textarea></label>
        <label>Фото акции
          <input type="file" id="promo-file" accept="image/*" />
        </label>
        <div class="preview" id="promo-preview"></div>
        <button type="button" class="btn-secondary" id="promo-clear">Убрать фото акции</button>
      </section>

      <section class="block">
        <h2>Фото столов</h2>
        <div id="tables-editor" class="stack"></div>
      </section>

      <section class="block">
        <h2>Фото / видео клуба</h2>
        <div id="gallery-editor" class="stack"></div>
      </section>

      <section class="block">
        <h2>Меню</h2>
        <div id="menu-editor" class="stack"></div>
        <button type="button" class="btn-secondary" id="add-category">+ Категория</button>
      </section>

      <section class="block">
        <label>Примечание под меню<textarea id="notice" rows="2"></textarea></label>
      </section>

      <div class="save-bar">
        <button type="button" class="btn-primary" id="save">Сохранить изменения</button>
        <span id="save-status"></span>
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
